name: DramaForge verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Remove obsolete NodeCanvas installer from build checkout
        run: node scripts/prepare-windows-installer-build.mjs
      - name: Test and verify JavaScript
        run: npm run check
      - name: Check public static assets
        run: |
          test -s web/index.html
          node --check web/bridge-client.mjs
          node --check bridge/server.mjs
