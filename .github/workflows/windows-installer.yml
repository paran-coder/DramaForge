name: Build and publish DramaForge Windows connector

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'bridge/**'
      - '.github/workflows/windows-installer.yml'
      - 'package.json'
      - 'scripts/prepare-windows-installer-build.mjs'
      - 'web/downloads/NodeCanvas-Setup-v1.13.0.exe'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Older source ZIPs contained the image-only NodeCanvas installer in public assets.
      # GitHub Desktop copies files but does not delete tracked files absent from a ZIP.
      - name: Remove obsolete NodeCanvas installer from build checkout
        run: node scripts/prepare-windows-installer-build.mjs
      - name: Run regression tests
        run: npm test
      - name: Build installer using NodeCanvas-derived native C# source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -LiteralPath 'web/downloads/DramaForge-Setup-Windows.exe' -Force -ErrorAction SilentlyContinue
          ./installer/build-windows.ps1
      - name: Verify compiled Windows PE and embedded installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='web/downloads/DramaForge-Setup-Windows.exe'
          if (-not (Test-Path -LiteralPath $p)) { throw 'Windows EXE was not built' }
          $bytes=[IO.File]::ReadAllBytes($p)
          if ($bytes.Length -lt 100000 -or $bytes.Length -gt 25000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows installer PE or size' }
          $offset=[BitConverter]::ToInt32($bytes,0x3c)
          if ($offset -lt 0x40 -or $offset+4 -ge $bytes.Length -or [Text.Encoding]::ASCII.GetString($bytes,$offset,4) -ne "PE`0`0") { throw 'Missing PE header' }
          $testdir=Join-Path $env:RUNNER_TEMP 'df-installer-payload-smoke'
          $proc=Start-Process -FilePath (Resolve-Path $p).Path -ArgumentList @('--extract-only',"`"$testdir`"") -PassThru -Wait
          if ($proc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $testdir 'bridge/server.mjs'))) { throw 'Installer payload extraction failed' }
          Get-FileHash $p -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DramaForge-Setup-Windows-v1.9.3-unsigned
          path: web/downloads/DramaForge-Setup-Windows.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: DramaForge-Setup-Windows-v1.9.3-unsigned
          path: web/downloads
      - name: Commit installer EXE to repository for Vercel static serving
        shell: bash
        run: |
          set -euo pipefail
          file=web/downloads/DramaForge-Setup-Windows.exe
          test -s "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Delete the previously committed image-only installer as part of the publish commit.
          git rm -f --ignore-unmatch -- web/downloads/NodeCanvas-Setup-v1.13.0.exe
          git add -- "$file"
          if git diff --cached --quiet; then
            echo 'EXE unchanged; no commit needed.'
            exit 0
          fi
          git commit -m 'build: publish DramaForge native Windows connector v1.9.3'
          git push origin HEAD:main
