name: Build DramaForge Windows Setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'bridge/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test project and bridge
        run: npm test
      - name: Parse installer PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('installer/install-windows.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
      - name: Compile native installer
        shell: pwsh
        run: ./installer/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DramaForge-Setup-Windows-v1.8.0-unsigned
          path: web/downloads/DramaForge-Setup-Windows.exe
          if-no-files-found: error
