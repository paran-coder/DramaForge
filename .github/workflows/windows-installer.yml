name: LEGACY ONLY - no longer used for website connector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run regression tests
        run: npm test
      - name: Compile NodeCanvas-derived native launcher and installer
        shell: pwsh
        run: ./installer/build-windows.ps1
      - name: Verify installer artifact is a real PE executable
        shell: pwsh
        run: |
          $p='web/downloads/DramaForge-Setup-Windows.exe'
          if (-not (Test-Path $p)){throw 'Compiled EXE missing'}
          $bytes=[IO.File]::ReadAllBytes($p)
          if ($bytes.Length -lt 100000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A){throw 'Not a valid installer PE'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DramaForge-Setup-Windows-v1.8.1-unsigned
          path: web/downloads/DramaForge-Setup-Windows.exe
          if-no-files-found: error
